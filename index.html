<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiCash — Digital Cash</title>
<meta name="description" content="Paying homage to the original anonymous digital cash of 1989.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#060c18;
    --navy-base:#0d1b33;
    --navy-panel:#101f3b;
    --gold:#c9a24a;
    --gold-light:#e8c89a;
    --ink:#eeeadf;
    --muted:#7c88a0;
    --rule:rgba(201,162,74,0.35);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #1d355b 0%, var(--navy-base) 45%, var(--navy-deep) 100%);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
  }
  main{
    width:100%;
    max-width:560px;
    text-align:center;
  }
  .mark{
    width:96px;
    height:96px;
    margin:0 auto 2rem;
    border-radius:50%;
    box-shadow:0 0 0 1px rgba(201,162,74,0.25), 0 20px 60px -20px rgba(0,0,0,0.7);
  }
  .mark img{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
  }
  h1{
    font-family:'Spectral', Georgia, serif;
    font-weight:600;
    font-size:clamp(2.4rem, 7vw, 3.6rem);
    line-height:1;
    margin:0;
    letter-spacing:0.01em;
    background:linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 65%, #a3803a 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    margin:0.9rem 0 0;
    font-size:0.8rem;
    letter-spacing:0.32em;
    color:var(--muted);
    font-weight:500;
  }
  .rule{
    width:64px;
    height:1px;
    margin:2.2rem auto;
    background:var(--rule);
    border:none;
  }
  p.tagline{
    font-family:'Spectral', Georgia, serif;
    font-style:italic;
    font-size:1.15rem;
    line-height:1.6;
    color:var(--ink);
    max-width:34ch;
    margin:0 auto;
  }
  nav{
    display:flex;
    justify-content:center;
    gap:2.4rem;
    margin-top:3rem;
    flex-wrap:wrap;
  }
  nav a{
    color:var(--gold-light);
    text-decoration:none;
    font-size:0.95rem;
    font-weight:500;
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  nav a:hover, nav a:focus-visible{
    color:var(--ink);
    border-bottom-color:var(--gold);
  }
  nav a:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:4px;
  }
  footer{
    margin-top:5rem;
    font-size:0.8rem;
    color:var(--muted);
  }
  footer span{
    color:var(--gold);
    opacity:0.7;
  }
  @media (prefers-reduced-motion: no-preference){
    .mark, h1, .subtitle, .rule, p.tagline, nav{
      opacity:0;
      animation:rise 0.7s ease forwards;
    }
    .mark{animation-delay:0.05s;}
    h1{animation-delay:0.15s;}
    .subtitle{animation-delay:0.25s;}
    .rule{animation-delay:0.35s;}
    p.tagline{animation-delay:0.42s;}
    nav{animation-delay:0.55s;}
    @keyframes rise{
      from{opacity:0; transform:translateY(10px);}
      to{opacity:1; transform:translateY(0);}
    }
  }
</style>
</head>
